<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Ozean - منصة الإبداع الفني</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{--bg-color:#fff;--text-main:#0f172a;--text-muted:#64748b;--primary-blue:#0284c7;--primary-cyan:#06b6d4;--border-color:#e2e8f0;--card-bg:#f8fafc}
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
        body{background:#0f172a;color:var(--text-main);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding-bottom:80px}
        .mobile-frame{width:100%;max-width:410px;background:var(--bg-color);min-height:100vh;position:relative;box-shadow:0 0 30px rgba(0,0,0,.5);display:flex;flex-direction:column}
        .app-header{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--border-color);background:#fff;position:sticky;top:0;z-index:100}
        .logo-area{display:flex;align-items:center;text-decoration:none;min-width:120px}
        .original-logo{display:block;width:126px;height:auto;object-fit:contain}
        .app-header-icons{display:flex;gap:15px;color:var(--text-main);font-size:16px;align-items:center}
        .app-header-icons button{border:0;background:transparent;color:inherit;font-size:inherit;padding:3px;cursor:pointer}
        .app-hero{margin:15px;border-radius:16px;overflow:hidden;position:relative;height:170px;background-image:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%),url('assets/art-portrait.png');background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:15px;color:#fff}
        .app-hero-content h3{font-size:18px;font-weight:800;margin-bottom:2px}
        .app-hero-content p{font-size:11px;color:#cbd5e1;margin-bottom:8px}
        .btn-sm-primary{display:inline-block;background:#fff;color:var(--text-main);padding:4px 14px;border-radius:12px;font-size:11px;font-weight:700;text-decoration:none}
        .section-title-custom{display:flex;justify-content:space-between;align-items:center;padding:0 20px;margin-bottom:12px}
        .section-title-custom h4{font-size:15px;font-weight:800}
        .section-title-custom span{font-size:12px;color:var(--primary-blue);cursor:pointer}
        .categories-grid-app{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 15px;margin-bottom:20px}
        .cat-card-app{background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:16px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.2s;cursor:pointer}
        .cat-card-app:hover,.cat-card-app:focus-visible{border-color:var(--primary-blue);transform:translateY(-2px);outline:none}
        .cat-card-app i{font-size:20px;color:var(--primary-blue)}
        .cat-card-app span{font-size:12px;font-weight:700;color:var(--text-main)}
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;width:100%;max-width:410px;margin:0 auto;background:#fff;border-top:1px solid var(--border-color);display:flex;justify-content:space-around;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:1000}
        .nav-link-app{display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--text-muted);font-size:10px;font-weight:700;min-width:50px}
        .nav-link-app i{font-size:16px;margin-bottom:3px}
        .nav-link-app.active{color:var(--primary-blue)}
        .toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;font-size:12px;display:none;z-index:1200;width:max-content;max-width:calc(100% - 24px)}
        @media(min-width:600px){body{padding-top:20px;padding-bottom:20px}.mobile-frame{min-height:calc(100vh - 40px);border-radius:22px;overflow:hidden}.bottom-nav{bottom:20px;border-radius:0 0 22px 22px}}
    </style>
</head>
<body>
<div class="mobile-frame" id="home">
    <header class="app-header">
        <a class="logo-area" href="#home" aria-label="Ozean - صنع بحب"><img src="assets/ozean-logo-original.png" alt="Ozean — صنع بحب" class="original-logo"></a>
        <div class="app-header-icons">
            <button type="button" aria-label="بحث" data-message="البحث قيد التجهيز"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button type="button" aria-label="حساب المستخدم" data-message="صفحة الحساب قيد التجهيز"><i class="fa-regular fa-user"></i></button>
            <button type="button" aria-label="القائمة" data-message="القائمة قيد التجهيز"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>
    <section class="app-hero" aria-label="اكتشف الأعمال الفنية">
        <div class="app-hero-content"><h3>إبداع بلا حدود</h3><p>اكتشف أفضل الأعمال الفنية الحصرية</p><a href="#categories" class="btn-sm-primary">تصفح الآن</a></div>
    </section>
    <section id="categories" aria-labelledby="categories-title">
        <div class="section-title-custom"><h4 id="categories-title">التصنيفات</h4><span role="button" tabindex="0" id="show-all">عرض الكل</span></div>
        <div class="categories-grid-app" id="categories-grid">
            <div class="cat-card-app" tabindex="0" role="button" data-category="اللوحات"><i class="fa-solid fa-palette"></i><span>اللوحات</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="الصور"><i class="fa-solid fa-camera"></i><span>الصور</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="الموسيقى"><i class="fa-solid fa-music"></i><span>الموسيقى</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="الفيديو"><i class="fa-solid fa-video"></i><span>الفيديو</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="الأزياء"><i class="fa-solid fa-shirt"></i><span>الأزياء</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="الأحذية"><i class="fa-solid fa-shoe-prints"></i><span>الأحذية</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="المجوهرات"><i class="fa-solid fa-gem"></i><span>المجوهرات</span></div>
            <div class="cat-card-app" tabindex="0" role="button" data-category="التصاميم"><i class="fa-solid fa-compass-drafting"></i><span>التصاميم</span></div>
        </div>
    </section>
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
        <a href="#home" class="nav-link-app active" data-nav="الرئيسية"><i class="fa-solid fa-house"></i><span>الرئيسية</span></a>
        <a href="#store" class="nav-link-app" data-nav="المتجر"><i class="fa-solid fa-store"></i><span>المتجر</span></a>
        <a href="#auctions" class="nav-link-app" data-nav="المزادات"><i class="fa-solid fa-gavel"></i><span>المزادات</span></a>
        <a href="#upload" class="nav-link-app" data-nav="رفع عمل"><i class="fa-solid fa-circle-plus"></i><span>رفع عمل</span></a>
        <a href="#account" class="nav-link-app" data-nav="حسابي"><i class="fa-regular fa-user"></i><span>حسابي</span></a>
    </nav>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>
<script>
const toast=document.getElementById('toast');let toastTimeout;
function showToast(message){toast.textContent=message;toast.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>toast.style.display='none',2200)}
document.querySelectorAll('[data-message]').forEach(button=>button.addEventListener('click',()=>showToast(button.dataset.message)));
document.querySelectorAll('.cat-card-app').forEach(card=>{
 const activate=()=>{document.querySelectorAll('.cat-card-app').forEach(item=>item.style.background='');card.style.background='#e0f2fe';showToast('تم اختيار تصنيف: '+card.dataset.category)};
 card.addEventListener('click',activate);card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();activate()}});
});
const showAll=document.getElementById('show-all');
showAll.addEventListener('click',()=>{document.querySelectorAll('.cat-card-app').forEach(item=>item.style.background='');showToast('تظهر جميع التصنيفات')});
showAll.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();showAll.click()}});
document.querySelectorAll('.nav-link-app').forEach(link=>link.addEventListener('click',event=>{event.preventDefault();document.querySelectorAll('.nav-link-app').forEach(item=>item.classList.remove('active'));link.classList.add('active');const destination=link.dataset.nav;showToast(destination==='الرئيسية'?'أهلاً بك في Ozean':'قسم '+destination+' قيد التجهيز')}));
</script>
</body>
</html>
